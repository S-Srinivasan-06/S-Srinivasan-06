name: Activity panels

# Redraws the contribution, commit and repository panels once a day and
# publishes them as a single commit on the `activity` branch, so main keeps
# only hand-written history. README.md loads the panels from that branch.

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity-panels
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render panels
        env:
          # Optional: a fine-grained token in ACTIVITY_TOKEN also counts private contributions in the totals.
          GITHUB_TOKEN: ${{ secrets.ACTIVITY_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/activity_panels.py --login "${{ github.repository_owner }}" --out "$RUNNER_TEMP/activity"

      - name: Publish to the activity branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ runner.temp }}/activity
        run: |
          git init -q -b activity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Activity panels for $(date -u +%F)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" activity
