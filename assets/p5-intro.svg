<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Srinivasan — backend, ML and agentic AI</title><desc id="desc">Computer Science undergraduate at KIIT, 2024–2028. Python and Java development across Spring Boot services, machine learning, local LLMs and agent workflows. Animated square grids and execution loops frame the introduction; text remains stationary.</desc><style>
.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}
.flow{animation:flow 7s linear infinite}.packet{animation:packet 8s ease-in-out infinite}.scan{animation:scan 9s ease-in-out infinite}.grid-step{animation:grid-step 12s ease-in-out infinite}.orbit{animation:orbit 40s linear infinite;transform-origin:0px 0px}
@keyframes flow{to{stroke-dashoffset:-112}}@keyframes packet{0%,100%{transform:translateX(0)}50%{transform:translateX(120px)}}@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(144px)}}@keyframes grid-step{0%,100%{transform:translate(0,0)}25%{transform:translate(48px,0)}50%{transform:translate(48px,48px)}75%{transform:translate(0,48px)}}@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.hero-turn{animation:orbit 48s linear infinite;transform-origin:0px 0px}.hero-counter{animation:orbit 64s linear infinite reverse;transform-origin:0px 0px}.hero-tile{animation:hero-tile 16s cubic-bezier(.65,0,.35,1) infinite}.hero-track{animation:hero-track 12s cubic-bezier(.65,0,.35,1) infinite}.hero-pulse{animation:hero-pulse 8s ease-in-out infinite}
