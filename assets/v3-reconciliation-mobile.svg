"M-20 0L-5 15L23-17" class="ink-line" stroke-width="5" /></g></g><rect x="1109" y="234" width="15" height="15" rx="0" class="ink"/><rect x="1109" y="249" width="15" height="15" rx="0" class="one"/><rect x="1109" y="264" width="15" height="15" rx="0" class="ink"/><rect x="1124" y="234" width="15" height="15" rx="0" class="one"/><rect x="1124" y="249" width="15" height="15" rx="0" class="ink"/><rect x="1124" y="264" width="15" height="15" rx="0" class="one"/><rect x="1139" y="234" width="15" height="15" rx="0" class="ink"/><rect x="1139" y="249" width="15" height="15" rx="0" class="one"/><rect x="1139" y="264" width="15" height="15" rx="0" class="ink"/><rect x="1154" y="234" width="15" height="15" rx="0" class="one"/><rect x="1154" y="249" width="15" height="15" rx="0" class="ink"/><rect x="1154" y="264" width="15" height="15" rx="0" class="one"/><rect x="1169" y="234" width="15" height="15" rx="0" class="ink"/><rect x="1169" y="249" width="15" height="15" rx="0" class="one"/><rect x="1169" y="264" width="15" height="15" rx="0" class="ink"/></svg></g></svg>