<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title"><title id="title">Srinivasan — software and agent systems</title><style>
.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}
.paper{fill:#F4EDDC}.ink{fill:#221D24}.line{fill:none;stroke:#221D24}.one{fill:#D94136;animation:p1 18s step-end infinite}.two{fill:#294DFF;animation:p2 18s step-end infinite}
.one-line{fill:none;stroke:#D94136;animation:s1 18s step-end infinite}.two-line{fill:none;stroke:#294DFF;animation:s2 18s step-end infinite}
.phase-b .one{fill:#5D287E;animation-delay:-9s}.phase-b .two{fill:#C9E54E;animation-delay:-9s}.phase-b .one-line{stroke:#5D287E;animation-delay:-9s}.phase-b .two-line{stroke:#C9E54E;animation-delay:-9s}
@keyframes p1{0%,100%{fill:#D94136}50%{fill:#5D287E}}@keyframes p2{0%,100%{fill:#294DFF}50%{fill:#C9E54E}}@keyframes s1{0%,100%{stroke:#D94136}50%{stroke:#5D287E}}@keyframes s2{0%,100%{stroke:#294DFF}50%{stroke:#C9E54E}}
.grid-move{animation:grid-move 8s ease-in-out infinite}.grid-return{animation:grid-move 8s ease-in-out -4s infinite}.drift{animation:drift 6s ease-in-out infinite}.loop{animation:turn 24s linear infinite;transform-origin:0px 0px}.reverse{animation:turn 32s linear infinite reverse;transform-origin:0px 0px}.scan{animation:scan 8s ease-in-out infinite}.dash{animation:dash 6s linear infinite}
@keyframes grid-move{0%,100%{transform:translate(0,0)}25%{transform:translate(96px,0)}50%{transform:translate(96px,96px)}75%{transform:translate(0,96px)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(144px)}}@keyframes dash{to{stroke-dashoffset:-80}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><clipPath id="frame"><rect x="0" y="0" width="1200" height="360" rx="8" class="paper"/></clipPath></defs><g class="phase-a" clip-path="url(#frame)"><rect x="0" y="0" width="1200" height="360" rx="0" class="paper"/><text x="40" y="48" font-size="15" class="ink mono" >SRINIVASAN / SOFTWARE &amp; AGENT SYSTEMS</text><text x="33" y="181" font-size="112" class="ink serif" letter-spacing="-5">Srinivasan.</text><text x="42" y="244" font-size="27" class="ink sans" >Computer science student at KIIT. I build local-first apps,</text><text x="42" y="284" font-size="27" class="ink sans" >backend systems, and tools that make LLMs useful.</text><path d="M40 315H1160" class="line" stroke-width="1" /><text x="42" y="342" font-size="15" class="ink mono" >CSE / CLASS OF 2028</text><text x="755" y="342" font-size="15" class="ink mono" >LOCAL MODELS · PRODUCT CRAFT · SYSTEMS</text><g transform="translate(1030 128) scale(0.62)"><g transform="translate(0 0) scale(1)"><g class="reverse"><rect x="-110" y="-110" width="220" height="220" class="one-line" stroke-width="2"/></g></g><g transform="translate(0 0) scale(1)"><g class="loop"><rect x="-98" y="-98" width="196" height="196" rx="0" class="line"/></g></g><g transform="translate(0 0) scale(1)"><g class="reverse"><rect x="-86" y="-86" width="172" height="172" class="one-line" stroke-width="2"/></g></g><g transform="translate(0 0) scale(1)"><g class="loop"><rect x="-74" y="-74" width="148" height="148" rx="0" class="line"/></g></g><g transform="translate(0 0) scale(1)"><g class="reverse"><rect x="-62" y="-62" width="124" height="124" class="one-line" stroke-width="2"/></g></g><g transform="translate(0 0) scale(1)"><g class="loop"><rect x="-50" y="-50" width="100" height="100" rx="0" class="line"/></g></g><g transform="translate(0 0) scale(1)"><g class="reverse"><rect x="-38" y="-38" width="76" height="76" class="one-line" stroke-width="2"/></g></g></g></g></svg>