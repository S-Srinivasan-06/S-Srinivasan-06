<svg xmlns="http://www.w3.org/2000/svg" width="600" height="555" viewBox="0 0 600 555" role="img" aria-labelledby="title desc"><title id="title">LLM development and custom harnesses</title><desc id="desc">Codex and Claude Code for repository exploration, implementation, debugging and review. Custom harnesses, local inference, structured outputs, scoped tool execution and agent orchestration are represented in Taskflow Local and Sandman.</desc><style>
.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}
.flow{animation:flow 7s linear infinite}.packet{animation:packet 8s ease-in-out infinite}.scan{animation:scan 9s ease-in-out infinite}.grid-step{animation:grid-step 12s ease-in-out infinite}.orbit{animation:orbit 40s linear infinite;transform-origin:0px 0px}
@keyframes flow{to{stroke-dashoffset:-112}}@keyframes packet{0%,100%{transform:translateX(0)}50%{transform:translateX(120px)}}@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(144px)}}@keyframes grid-step{0%,100%{transform:translate(0,0)}25%{transform:translate(48px,0)}50%{transform:translate(48px,48px)}75%{transform:translate(0,48px)}}@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><clipPath id="frame"><rect x="0" y="0" width="600" height="555" rx="14" fill="#F5F0E7"/></clipPath></defs><g clip-path="url(#frame)"><rect x="0" y="0" width="600" height="555" rx="0" fill="#F5F0E7"/><text x="30" y="43" font-size="15" fill="#96394A" class="mono" letter-spacing=".4">LLM DEVELOPMENT</text><text x="28" y="106" font-size="42" fill="#252C36" class="serif" >Coding agents,</text><text x="28" y="157" font-size="42" fill="#252C36" class="serif" >custom harnesses,</text><text x="28" y="208" font-size="42" fill="#252C36" class="serif" >and local models.</text><text x="30" y="253" font-size="24" fill="#252C36" class="sans" >I use Codex and Claude Code to explore repositories,</text><text x="30" y="289" font-size="24" fill="#252C36" class="sans" >implement changes, debug, and review.</text><text x="30" y="325" font-size="24" fill="#252C36" class="sans" >Taskflow Local and Sandman connect models to</text><text x="30" y="361" font-size="24" fill="#252C36" class="sans" >structured outputs, validation, and tool access.</text><text x="30" y="397" font-size="24" fill="#252C36" class="sans" >Their loops cover local inference, orchestration,</text><text x="30" y="433" font-size="24" fill="#252C36" class="sans" >retries, and cleanup.</text><path d="M30 470H570" stroke="#EAD5D4" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="30" y="512" font-size="15" fill="#96394A" class="mono" letter-spacing=".4">CONTEXT / TOOLS / VALIDATION / REVIEW</text></g></svg>