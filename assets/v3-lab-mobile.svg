ect x="135" y="541" width="420" height="55" rx="10" class="paper"/><g transform="translate(93 568) scale(0.7)"><g class="bob"><circle cx="0" cy="-20" r="7" class="paper"/><circle cx="-23" cy="22" r="7" class="paper"/><circle cx="23" cy="22" r="7" class="paper"/><path d="M0-13V4M-23 15V4H23V15" class="ink-line" stroke-width="3" /></g></g><text x="152" y="577" class="ink sans" font-size="26" font-weight="700" >ORCHESTRATION</text></g></svg>