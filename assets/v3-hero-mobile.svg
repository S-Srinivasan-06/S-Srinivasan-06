und"/></g></g><g transform="translate(500 507) scale(1)"><g class="counter"><path d="M-24 0H24M0-24V24" class="ink-line" stroke-width="4" /></g></g><path d="M30 511C128 471 240 557 354 517" class="two-line" stroke-width="4" /><circle cx="32" cy="511" r="8" class="one"/><text x="30" y="556" class="ink mono" font-size="14" >KIIT / CSE / 2028</text></g></svg>