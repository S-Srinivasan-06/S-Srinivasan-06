<svg xmlns="http://www.w3.org/2000/svg" width="600" height="660" viewBox="0 0 600 660" role="img" aria-labelledby="title"><title id="title">LLMs, Codex, Claude Code, local models, custom harnesses and orchestration</title><style>
.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}
.paper{fill:#F4EDDC}.ink{fill:#221D24}.line{fill:none;stroke:#221D24}.one{fill:#D94136;animation:p1 18s step-end infinite}.two{fill:#294DFF;animation:p2 18s step-end infinite}
.one-line{fill:none;stroke:#D94136;animation:s1 18s step-end infinite}.two-line{fill:none;stroke:#294DFF;animation:s2 18s step-end infinite}
.phase-b .one{fill:#5D287E;animation-delay:-9s}.phase-b .two{fill:#C9E54E;animation-delay:-9s}.phase-b .one-line{stroke:#5D287E;animation-delay:-9s}.phase-b .two-line{stroke:#C9E54E;animation-delay:-9s}
@keyframes p1{0%,100%{fill:#D94136}50%{fill:#5D287E}}@keyframes p2{0%,100%{fill:#294DFF}50%{fill:#C9E54E}}@keyframes s1{0%,100%{stroke:#D94136}50%{stroke:#5D287E}}@keyframes s2{0%,100%{stroke:#294DFF}50%{stroke:#C9E54E}}
.grid-move{animation:grid-move 8s ease-in-out infinite}.grid-return{animation:grid-move 8s ease-in-out -4s infinite}.drift{animation:drift 6s ease-in-out infinite}.loop{animation:turn 24s linear infinite;transform-origin:0px 0px}.reverse{animation:turn 32s linear infinite reverse;transform-origin:0px 0px}.scan{animation:scan 8s ease-in-out infinite}.dash{animation:dash 6s linear infinite}
@keyframes grid-move{0%,100%{transform:translate(0,0)}25%{transform:translate(96px,0)}50%{transform:translate(96px,96px)}75%{transform:translate(0,96px)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(144px)}}@keyframes dash{to{stroke-dashoffset:-80}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><clipPath id="frame"><rect x="0" y="0" width="600" height="660" rx="8" class="paper"/></clipPath></defs><g class="phase-a" clip-path="url(#frame)"><rect x="0" y="0" width="600" height="660" rx="0" class="paper"/><text x="30" y="40" font-size="15" class="ink mono" >02 / LLMS &amp; AGENT ENGINEERING</text><text x="28" y="103" font-size="43" class="ink serif" >Working with models.</text><text x="28" y="154" font-size="43" class="ink serif" >Building the harness</text><text x="28" y="205" font-size="43" class="ink serif" >around them.</text><text x="30" y="246" font-size="15" class="ink mono" >CODEX / CLAUDE CODE</text><text x="30" y="281" font-size="23" class="ink sans" >I use coding agents for repository exploration,</text><text x="30" y="315" font-size="23" class="ink sans" >implementation, debugging, and review.</text><text x="30" y="349" font-size="23" class="ink sans" >Clear tasks and checks keep the work grounded.</text><text x="30" y="407" font-size="15" class="ink mono" >LOCAL LLMS / CUSTOM HARNESSES</text><text x="30" y="431" font-size="15" class="ink mono" >AGENT ORCHESTRATION</text><text x="30" y="466" font-size="23" class="ink sans" >Local inference, typed outputs, and tool access.</text><text x="30" y="500" font-size="23" class="ink sans" >Validation and review before changes run.</text><text x="30" y="534" font-size="23" class="ink sans" >Custom harnesses coordinate agents, retries,</text><text x="30" y="568" font-size="23" class="ink sans" >and cleanup, with clear boundaries between</text><text x="30" y="602" font-size="23" class="ink sans" >planning, execution, and verification.</text><g transform="translate(315 625) scale(1)"><path d="M0 0V24" class="line" stroke-width="1" /><path d="M24 0V24" class="line" stroke-width="1" /><path d="M48 0V24" class="line" stroke-width="1" /><path d="M72 0V24" class="line" stroke-width="1" /><path d="M96 0V24" class="line" stroke-width="1" /><path d="M120 0V24" class="line" stroke-width="1" /><path d="M144 0V24" class="line" stroke-width="1" /><path d="M168 0V24" class="line" stroke-width="1" /><path d="M192 0V24" class="line" stroke-width="1" /><path d="M0 0H192" class="line" stroke-width="1" /><path d="M0 24H192" class="line" stroke-width="1" /></g><g transform="translate(315 625) scale(1)"><g class="scan"><rect x="0" y="0" width="24" height="24" rx="0" class="one"/></g></g></g></svg>