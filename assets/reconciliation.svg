  <text x="40" y="174" class="sans" font-size="47" font-weight="650" letter-spacing="-1.5" fill="#172c23">Reconciliation Agent</text>
  <text x="44" y="216" class="sans" font-size="20" fill="#536257">From scattered records to a clear trail.</text>
