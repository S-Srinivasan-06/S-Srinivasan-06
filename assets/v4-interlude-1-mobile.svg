<svg xmlns="http://www.w3.org/2000/svg" width="600" height="115" viewBox="0 0 600 115" role="img" aria-labelledby="title"><title id="title">Visual study 1 — looping geometric interlude</title><style>
.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}
.paper{fill:#F4EDDC}.ink{fill:#221D24}.line{fill:none;stroke:#221D24}.one{fill:#D94136;animation:p1 18s step-end infinite}.two{fill:#294DFF;animation:p2 18s step-end infinite}
.one-line{fill:none;stroke:#D94136;animation:s1 18s step-end infinite}.two-line{fill:none;stroke:#294DFF;animation:s2 18s step-end infinite}
.phase-b .one{fill:#5D287E;animation-delay:-9s}.phase-b .two{fill:#C9E54E;animation-delay:-9s}.phase-b .one-line{stroke:#5D287E;animation-delay:-9s}.phase-b .two-line{stroke:#C9E54E;animation-delay:-9s}
@keyframes p1{0%,100%{fill:#D94136}50%{fill:#5D287E}}@keyframes p2{0%,100%{fill:#294DFF}50%{fill:#C9E54E}}@keyframes s1{0%,100%{stroke:#D94136}50%{stroke:#5D287E}}@keyframes s2{0%,100%{stroke:#294DFF}50%{stroke:#C9E54E}}
.grid-move{animation:grid-move 8s ease-in-out infinite}.grid-return{animation:grid-move 8s ease-in-out -4s infinite}.drift{animation:drift 6s ease-in-out infinite}.loop{animation:turn 24s linear infinite;transform-origin:0px 0px}.reverse{animation:turn 32s linear infinite reverse;transform-origin:0px 0px}.scan{animation:scan 8s ease-in-out infinite}.dash{animation:dash 6s linear infinite}
@keyframes grid-move{0%,100%{transform:translate(0,0)}25%{transform:translate(96px,0)}50%{transform:translate(96px,96px)}75%{transform:translate(0,96px)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(144px)}}@keyframes dash{to{stroke-dashoffset:-80}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><clipPath id="frame"><rect x="0" y="0" width="600" height="115" rx="8" class="paper"/></clipPath></defs><g class="phase-a" clip-path="url(#frame)"><rect x="0" y="0" width="600" height="115" rx="0" class="paper"/><text x="30" y="34" font-size="15" class="ink mono" >VISUAL STUDY / 01</text><g transform="translate(46 69) scale(1.7)"><path d="M0 0V24" class="line" stroke-width="1" /><path d="M24 0V24" class="line" stroke-width="1" /><path d="M48 0V24" class="line" stroke-width="1" /><path d="M72 0V24" class="line" stroke-width="1" /><path d="M96 0V24" class="line" stroke-width="1" /><path d="M120 0V24" class="line" stroke-width="1" /><path d="M144 0V24" class="line" stroke-width="1" /><path d="M168 0V24" class="line" stroke-width="1" /><path d="M192 0V24" class="line" stroke-width="1" /><path d="M216 0V24" class="line" stroke-width="1" /><path d="M240 0V24" class="line" stroke-width="1" /><path d="M0 0H240" class="line" stroke-width="1" /><path d="M0 24H240" class="line" stroke-width="1" /><g transform="translate(0 0) scale(1)"><g class="scan"><rect x="0" y="0" width="24" height="24" rx="0" class="one"/></g></g><g transform="translate(48 0) scale(1)"><g class="scan"><rect x="0" y="0" width="24" height="24" rx="0" class="two"/></g></g></g></g></svg>