<svg xmlns="http://www.w3.org/2000/svg" width="600" height="743" viewBox="0 0 600 743" role="img" aria-labelledby="title desc"><title id="title">Sandman</title><desc id="desc">A coding agent with Docker workspaces and MCP tools. LangGraph coordinates execution, retries, and cleanup. Routing connects local and hosted model providers. PYTHON / LANGGRAPH / MCP / DOCKER / OLLAMA. Agent orchestration · Tool execution · Model routing. Open the repository to read the implementation.</desc><style>
.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}
.flow{animation:flow 7s linear infinite}.packet{animation:packet 8s ease-in-out infinite}.scan{animation:scan 9s ease-in-out infinite}.grid-step{animation:grid-step 12s ease-in-out infinite}.orbit{animation:orbit 40s linear infinite;transform-origin:0px 0px}
@keyframes flow{to{stroke-dashoffset:-112}}@keyframes packet{0%,100%{transform:translateX(0)}50%{transform:translateX(120px)}}@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(144px)}}@keyframes grid-step{0%,100%{transform:translate(0,0)}25%{transform:translate(48px,0)}50%{transform:translate(48px,48px)}75%{transform:translate(0,48px)}}@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><clipPath id="frame"><rect x="0" y="0" width="600" height="743" rx="14" fill="#F5F0E7"/></clipPath></defs><g clip-path="url(#frame)"><rect x="0" y="0" width="600" height="743" rx="0" fill="#F5F0E7"/><rect x="0" y="0" width="600" height="743" rx="0" fill="#67487F"/><text x="30" y="45" font-size="15" fill="#F5F0E7" class="mono" letter-spacing=".4">05 / AGENTIC AI / LLMS</text><text x="27" y="118" font-size="55" fill="#F5F0E7" class="serif" letter-spacing="-1.5">Sandman</text><text x="30" y="179" font-size="24" fill="#F5F0E7" class="sans" >An agent that writes and runs code in Docker.</text><text x="30" y="214" font-size="24" fill="#F5F0E7" class="sans" >LangGraph handles retries, checks, and cleanup.</text><text x="30" y="249" font-size="24" fill="#F5F0E7" class="sans" >MCP tools plus local and hosted model routing.</text><text x="30" y="291" font-size="15" fill="#F5F0E7" class="mono" letter-spacing=".4">PYTHON / LANGGRAPH / MCP / DOCKER / OLLAMA</text><text x="30" y="334" font-size="21" fill="#F5F0E7" class="sans" >Orchestration · Tool execution · Model routing</text><g transform="translate(40 371) scale(1.29)"><rect x="0" y="0" width="402" height="234" rx="12" fill="#E0D8E9"/><text x="21" y="31" font-size="12" fill="#67487F" class="mono" letter-spacing=".4">STATEFUL EXECUTION</text><rect x="22" y="69" width="104" height="40" rx="7" fill="#F5F0E7" stroke="#67487F" stroke-width="1.5"/><text x="74.0" y="95" font-size="14" fill="#67487F" class="mono" text-anchor="middle">RUN</text><rect x="149" y="69" width="104" height="40" rx="7" fill="#F5F0E7" stroke="#67487F" stroke-width="1.5"/><text x="201.0" y="95" font-size="14" fill="#67487F" class="mono" text-anchor="middle">CHECK</text><rect x="276" y="69" width="104" height="40" rx="7" fill="#F5F0E7" stroke="#67487F" stroke-width="1.5"/><text x="328.0" y="95" font-size="14" fill="#67487F" class="mono" text-anchor="middle">BUNDLE</text><path d="M126 89H149M253 89H276M328 109V154H74V109" stroke="#67487F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8" class="flow"/><rect x="134" y="135" width="134" height="40" rx="7" fill="#F5F0E7" stroke="#67487F" stroke-width="1.5"/><text x="201.0" y="161" font-size="14" fill="#67487F" class="mono" text-anchor="middle">RETRY</text><text x="22" y="214" font-size="12" fill="#67487F" class="mono" letter-spacing=".4">MCP / DOCKER / MODEL ROUTING</text></g><path d="M30 677H570" stroke="#E0D8E9" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="30" y="717" font-size="17" fill="#F5F0E7" class="mono" letter-spacing=".4">VIEW REPOSITORY ↗</text><path d="M534 715L555 694M534 694H555V715" stroke="#F5F0E7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g></svg>