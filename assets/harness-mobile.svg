<svg xmlns="http://www.w3.org/2000/svg" width="600" height="830" viewBox="0 0 600 830" role="img" aria-labelledby="title desc">
<title id="title">The harness is part of the product</title><desc id="desc">Conceptual agent workflow: scoped context, models and tools, execution, validation, and review. A feedback loop supports refinement and retries.</desc>
<style>.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}.flow{animation:flow 8s linear infinite}@keyframes flow{to{stroke-dashoffset:-96}}
@media (prefers-reduced-motion: reduce) { .spin, .flow, .float, .pulse { animation: none !important; } }</style>
<defs><clipPath id="frame"><rect x="0" y="0" width="600" height="830" rx="18" fill="white"/></clipPath></defs>
<g clip-path="url(#frame)"><rect x="0" y="0" width="600" height="830" rx="0" fill="#F6F0E6"/><text x="32" y="61" class="serif" font-size="38" fill="#982D3C" >The harness is part</text><text x="32" y="108" class="serif" font-size="38" fill="#982D3C" font-style="italic">of the product.</text><path d="M62 188L62 680" stroke="#982D3C" stroke-width="2" class="flow" stroke-dasharray="8 16"/><circle cx="62" cy="192" r="21" fill="#982D3C"/><text x="62" y="198" class="mono" font-size="15" fill="#F6F0E6" text-anchor="middle">1</text><text x="112" y="186" class="mono" font-size="18" fill="#982D3C" >CONTEXT</text><text x="112" y="223" class="serif" font-size="23" fill="#2B2220" >Goal + boundaries</text><circle cx="62" cy="312" r="21" fill="#982D3C"/><text x="62" y="318" class="mono" font-size="15" fill="#F6F0E6" text-anchor="middle">2</text><text x="112" y="306" class="mono" font-size="18" fill="#982D3C" >MODEL + TOOLS</text><text x="112" y="343" class="serif" font-size="23" fill="#2B2220" >Scoped capabilities</text><circle cx="62" cy="432" r="21" fill="#982D3C"/><text x="62" y="438" class="mono" font-size="15" fill="#F6F0E6" text-anchor="middle">3</text><text x="112" y="426" class="mono" font-size="18" fill="#982D3C" >EXECUTE</text><text x="112" y="463" class="serif" font-size="23" fill="#2B2220" >Actions + feedback</text><circle cx="62" cy="552" r="21" fill="#982D3C"/><text x="62" y="558" class="mono" font-size="15" fill="#F6F0E6" text-anchor="middle">4</text><text x="112" y="546" class="mono" font-size="18" fill="#982D3C" >VALIDATE</text><text x="112" y="583" class="serif" font-size="23" fill="#2B2220" >Schemas + checks</text><circle cx="62" cy="672" r="21" fill="#982D3C"/><text x="62" y="678" class="mono" font-size="15" fill="#F6F0E6" text-anchor="middle">5</text><text x="112" y="666" class="mono" font-size="18" fill="#982D3C" >REVIEW</text><text x="112" y="703" class="serif" font-size="23" fill="#2B2220" >Explicit control</text><path d="M32 761L568 761" stroke="#DDCDC0" stroke-width="1" /><text x="32" y="796" class="mono" font-size="14" fill="#982D3C" letter-spacing="1">OBSERVE → REFINE → RETRY</text></g></svg>