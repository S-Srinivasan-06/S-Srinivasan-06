" stroke="#96394A" stroke-width="1.5"/><text x="307.0" y="167" font-size="14" fill="#96394A" class="mono" text-anchor="middle">SQLITE</text><path d="M166 76H235M307 96V118H94V141M166 161H235" stroke="#96394A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8" class="flow"/><text x="21" y="212" font-size="12" fill="#96394A" class="mono" letter-spacing=".4">SCHEMA CHECK → REVIEW → SAVE</text></g><path d="M30 677H570" stroke="#EAD5D4" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="30" y="717" font-size="17" fill="#F5F0E7" class="mono" letter-spacing=".4">VIEW REPOSITORY ↗</text><path d="M534 715L555 694M534 694H555V715" stroke="#F5F0E7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g></svg>