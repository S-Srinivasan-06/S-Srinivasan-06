 stroke-width="1.5" /><path d="M206-21L226 21" class="two-line" stroke-width="1.5" /><path d="M224-21L244 21" class="two-line" stroke-width="1.5" /><path d="M242-21L262 21" class="two-line" stroke-width="1.5" /><path d="M260-21L280 21" class="two-line" stroke-width="1.5" /></g></g></g></svg>