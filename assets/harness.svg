<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">The harness is part of the product</title><desc id="desc">Conceptual agent workflow: scoped context, models and tools, execution, validation, and review. A feedback loop supports refinement and retries.</desc>
<style>.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}.flow{animation:flow 8s linear infinite}@keyframes flow{to{stroke-dashoffset:-96}}
@media (prefers-reduced-motion: reduce) { .spin, .flow, .float, .pulse { animation: none !important; } }</style>
<defs><clipPath id="frame"><rect x="0" y="0" width="1200" height="330" rx="18" fill="white"/></clipPath></defs>
<g clip-path="url(#frame)"><rect x="0" y="0" width="1200" height="330" rx="0" fill="#F6F0E6"/><text x="44" y="61" class="serif" font-size="43" fill="#982D3C" >The harness is part of the product.</text><path d="M134 152L1058 152" stroke="#982D3C" stroke-width="2" class="flow" stroke-dasharray="8 16"/><rect x="44" y="123" width="184" height="61" rx="8" fill="#982D3C"/><text x="136" y="159" class="mono" font-size="13" fill="#F6F0E6" text-anchor="middle">CONTEXT</text><text x="136" y="220" class="serif" font-size="18" fill="#78635D" text-anchor="middle">Goal + boundaries</text><rect x="276" y="123" width="184" height="61" rx="8" fill="#982D3C"/><text x="368" y="159" class="mono" font-size="13" fill="#F6F0E6" text-anchor="middle">MODEL + TOOLS</text><text x="368" y="220" class="serif" font-size="18" fill="#78635D" text-anchor="middle">Scoped capabilities</text><rect x="508" y="123" width="184" height="61" rx="8" fill="#982D3C"/><text x="600" y="159" class="mono" font-size="13" fill="#F6F0E6" text-anchor="middle">EXECUTE</text><text x="600" y="220" class="serif" font-size="18" fill="#78635D" text-anchor="middle">Actions + feedback</text><rect x="740" y="123" width="184" height="61" rx="8" fill="#982D3C"/><text x="832" y="159" class="mono" font-size="13" fill="#F6F0E6" text-anchor="middle">VALIDATE</text><text x="832" y="220" class="serif" font-size="18" fill="#78635D" text-anchor="middle">Schemas + checks</text><rect x="972" y="123" width="184" height="61" rx="8" fill="#982D3C"/><text x="1064" y="159" class="mono" font-size="13" fill="#F6F0E6" text-anchor="middle">REVIEW</text><text x="1064" y="220" class="serif" font-size="18" fill="#78635D" text-anchor="middle">Explicit control</text><path d="M1064 240V271H136V240" fill="none" stroke="#982D3C" stroke-width="1.2"/><rect x="445" y="256" width="310" height="32" rx="0" fill="#F6F0E6"/><text x="600" y="278" class="mono" font-size="12" fill="#982D3C" text-anchor="middle" letter-spacing="1">OBSERVE → REFINE → RETRY</text></g></svg>