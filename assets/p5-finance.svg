e-width="1.5"/><text x="72.0" y="176" font-size="14" fill="#7B5725" class="mono" text-anchor="middle">BANK</text><path d="M122 74H152V170H122M152 122H188" stroke="#7B5725" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8" class="flow"/><rect x="188" y="101" width="191" height="40" rx="7" fill="#F5F0E7" stroke="#7B5725" stroke-width="1.5"/><text x="283.5" y="127" font-size="14" fill="#7B5725" class="mono" text-anchor="middle">MATCH + REVIEW</text><path d="M205 165H361" stroke="#7B5725" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><rect x="205" y="164" width="8" height="8" rx="2" fill="#7B5725"/><g transform="translate(222 164) scale(1)"><g class="packet"><rect x="0" y="0" width="8" height="8" rx="2" fill="#7B5725"/></g></g><text x="22" y="218" font-size="12" fill="#7B5725" class="mono" letter-spacing=".4">RESUME / EXPORT / AUDIT</text></g><path d="M42 397H1158" stroke="#EADFC6" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="42" y="438" font-size="17" fill="#F5F0E7" class="mono" letter-spacing=".4">VIEW REPOSITORY ↗</text><path d="M1110 438L1133 415M1110 415H1133V438" stroke="#F5F0E7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g></svg>