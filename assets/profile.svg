<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&amp;family=Inter:wght@400;700;900&amp;display=swap');
      .bg { fill: #0A0A0A; }
      .grid-line { fill: none; stroke-width: 14; }
      .teal { stroke: #8FC1C1; }
      .sage { stroke: #CDDFCD; }
      .pink-fill { fill: #E3006D; }
      .title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 68px; fill: #F8F6F1; letter-spacing: -0.04em; }
      .subtitle { font-family: 'Fira Code', monospace; font-weight: 700; font-size: 18px; fill: #8FC1C1; letter-spacing: 0.15em; text-transform: uppercase; }
      .tag-text { font-family: 'Fira Code', monospace; font-weight: 700; font-size: 13px; fill: #0A0A0A; }
      .tag-bg { fill: #8FC1C1; }
      .desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 18px; fill: #CDDFCD; opacity: 0.85; }
    </style>
    <clipPath id="tl"><rect width="240" height="240" fill="none"/></clipPath>
    <clipPath id="tr"><rect x="960" width="240" height="240" fill="none"/></clipPath>
    <clipPath id="bl"><rect y="180" width="240" height="240" fill="none"/></clipPath>
    <clipPath id="br"><rect x="960" y="180" width="240" height="240" fill="none"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" class="bg" />

  <!-- Corner Geometric Grids -->
  <g clip-path="url(#tl)">
    <g>
      <rect x="-30" y="-30" width="60" height="60" class="grid-line teal" />
      <rect x="-70" y="-70" width="140" height="140" class="grid-line sage" />
      <rect x="-110" y="-110" width="220" height="220" class="grid-line teal" />
      <rect x="-150" y="-150" width="300" height="300" class="grid-line sage" />
      <rect x="-190" y="-190" width="380" height="380" class="grid-line teal" />
    </g>
  </g>

  <g clip-path="url(#tr)">
    <g>
      <rect x="1170" y="-30" width="60" height="60" class="grid-line teal" />
      <rect x="1130" y="-70" width="140" height="140" class="grid-line sage" />
      <rect x="1090" y="-110" width="220" height="220" class="grid-line teal" />
      <rect x="1050" y="-150" width="300" height="300" class="grid-line sage" />
      <rect x="1010" y="-190" width="380" height="380" class="grid-line teal" />
    </g>
  </g>

  <g clip-path="url(#bl)">
    <g>
      <rect x="-30" y="390" width="60" height="60" class="grid-line teal" />
      <rect x="-70" y="350" width="140" height="140" class="grid-line sage" />
      <rect x="-110" y="310" width="220" height="220" class="grid-line teal" />
      <rect x="-150" y="270" width="300" height="300" class="grid-line sage" />
      <rect x="-190" y="230" width="380" height="380" class="grid-line teal" />
    </g>
  </g>

  <g clip-path="url(#br)">
    <g>
      <rect x="1170" y="390" width="60" height="60" class="grid-line teal" />
      <rect x="1130" y="350" width="140" height="140" class="grid-line sage" />
      <rect x="1090" y="310" width="220" height="220" class="grid-line teal" />
      <rect x="1050" y="270" width="300" height="300" class="grid-line sage" />
      <rect x="1010" y="230" width="380" height="380" class="grid-line teal" />
    </g>
  </g>

  <!-- Content Group -->
  <g transform="translate(100, 110)">
    <text x="0" y="0" class="subtitle">&gt; S_SRINIVASAN.SYS</text>
    <text x="0" y="70" class="title">BACKEND <tspan class="pink-fill">&amp;</tspan> AGENTIC AI</text>
    <text x="0" y="140" class="title">SYSTEMS DEVELOPER</text>
    <text x="0" y="190" class="desc">High-performance APIs, containerized agent runtimes, and distributed workflows.</text>

    <!-- Badges -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="120" height="30" rx="4" class="tag-bg" />
      <text x="60" y="20" text-anchor="middle" class="tag-text">SPRING BOOT</text>

      <rect x="130" y="0" width="105" height="30" rx="4" class="tag-bg" />
      <text x="182" y="20" text-anchor="middle" class="tag-text">LANGGRAPH</text>

      <rect x="245" y="0" width="60" height="30" rx="4" class="tag-bg" />
      <text x="275" y="20" text-anchor="middle" class="tag-text">MCP</text>

      <rect x="315" y="0" width="85" height="30" rx="4" class="tag-bg" />
      <text x="357" y="20" text-anchor="middle" class="tag-text">DOCKER</text>

      <rect x="410" y="0" width="75" height="30" rx="4" class="tag-bg" />
      <text x="447" y="20" text-anchor="middle" class="tag-text">REDIS</text>
    </g>
  </g>
</svg>
