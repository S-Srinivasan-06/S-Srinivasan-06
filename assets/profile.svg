<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 4080">
<title>S. Srinivasan — Backend &amp; Agentic AI Systems Developer</title>
<style>
  .h{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:900;}
  .m{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:500;}
  .s{font-family:'Times New Roman',Times,serif;}
  .breathe{animation:breathe 11s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}
  .mq1{animation:mq1 24s linear infinite;}
  .mq2{animation:mq2 28s linear infinite;}
  .bob{animation:bob 2s ease-in-out infinite;}
  .blink{animation:blink 1.1s steps(2) infinite;}
  .spin{animation:spin 9s linear infinite;transform-box:fill-box;transform-origin:center;}
  .rotA{animation:spin 90s linear infinite;transform-box:fill-box;transform-origin:center;}
  .rotB{animation:spinR 90s linear infinite;transform-box:fill-box;transform-origin:center;}
  .sweep{animation:sweep 3.4s cubic-bezier(0.87,0,0.13,1) infinite;transform-box:fill-box;transform-origin:left center;}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  @keyframes mq1{to{transform:translateX(-2840px)}}
  @keyframes mq2{from{transform:translateX(-2960px)}to{transform:translateX(0)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
  @keyframes blink{50%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinR{to{transform:rotate(-360deg)}}
  @keyframes sweep{0%{transform:scaleX(0)}60%,100%{transform:scaleX(1)}}
</style>

<defs>
