<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3006D" />
      <stop offset="50%" stop-color="#C8953A" />
      <stop offset="100%" stop-color="#5DA9E9" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes floatPulse {
      0%, 100% { opacity: 0.15; transform: translateY(0px) scale(1); }
      50% { opacity: 0.4; transform: translateY(-15px) scale(1.05); }
    }
    @keyframes rotateRings {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateRingsReverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes textPulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    .particle {
      animation: floatPulse 4s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }
    .ring-cw {
      animation: rotateRings 25s linear infinite;
      transform-origin: center;
      transform-box: fill-box;
    }
    .ring-ccw {
      animation: rotateRingsReverse 30s linear infinite;
      transform-origin: center;
      transform-box: fill-box;
    }
    .sub-text {
      animation: textPulse 3s ease-in-out infinite;
    }
    .font-main {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Animated Background Particles -->
  <circle cx="150" cy="100" r="80" fill="#FFFFFF" class="particle" style="animation-delay: 0s;"/>
  <circle cx="1050" cy="300" r="120" fill="#FFFFFF" class="particle" style="animation-delay: 1.5s;"/>
  <circle cx="600" cy="80" r="50" fill="#FFFFFF" class="particle" style="animation-delay: 0.7s;"/>
  <circle cx="900" cy="120" r="30" fill="#FFFFFF" class="particle" style="animation-delay: 2.2s;"/>

  <!-- Left Rotating Technical Rings -->
  <g transform="translate(200, 200)">
    <g class="ring-cw">
      <circle cx="0" cy="0" r="120" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 15" opacity="0.3"/>
      <circle cx="0" cy="0" r="150" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="4 20" opacity="0.2"/>
    </g>
  </g>

  <!-- Right Rotating Technical Rings -->
  <g transform="translate(1000, 200)">
    <g class="ring-ccw">
      <circle cx="0" cy="0" r="110" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="15 10" opacity="0.3"/>
      <circle cx="0" cy="0" r="140" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="5 25" opacity="0.2"/>
    </g>
  </g>

  <!-- Main Content -->
  <g filter="url(#glow)">
    <text x="600" y="190" class="font-main" font-size="76" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">
      S. SRINIVASAN
    </text>
  </g>
  
  <text x="600" y="245" class="font-main sub-text" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">
    BACKEND &amp; AGENTIC AI SYSTEMS DEVELOPER
  </text>

  <!-- Decorative Tech Elements -->
  <g opacity="0.5" font-size="40" text-anchor="middle">
    <text x="350" y="330">⚡</text>
    <text x="500" y="330">☕</text>
    <text x="700" y="330">🐳</text>
    <text x="850" y="330">🤖</text>
  </g>
  
  <!-- Bottom Pulsing Accent Line (Using native SMIL animate to bypass CSS sanitizers) -->
  <rect x="400" y="270" width="400" height="4" rx="2" fill="#FFFFFF" opacity="0.8">
    <animate attributeName="width" values="400;420;400" dur="3s" repeatCount="indefinite" />
    <animate attributeName="x" values="400;390;400" dur="3s" repeatCount="indefinite" />
  </rect>
</svg>
