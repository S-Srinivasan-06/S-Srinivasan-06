<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Taskflow Local — local by design</title>
  <desc id="desc">A desktop product illustration with a task list and the input, model, review, and save workflow. This is a conceptual illustration, not a screenshot.</desc>
  <defs><clipPath id="frame"><rect width="1200" height="460" rx="24"/></clipPath></defs>
  <style>.display{font-family:Georgia,'Times New Roman',serif}
    .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, 'Courier New', monospace; }
    .flow { animation: flow 8s linear infinite; }
    .float { animation: float 7s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -96; } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @media (prefers-reduced-motion: reduce) { .flow, .float { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="#982D3C"/>
    <path d="M632 0V460M1200 386H632" stroke="#B14D5A"/>
    <text x="44" y="54" class="mono" font-size="14" letter-spacing="2" fill="#F1D3C8">01 / FEATURED PROJECT</text>
    <rect x="1035" y="31" width="120" height="30" rx="15" fill="#F5D6C6"/>
    <text x="1095" y="51" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#982D3C">WINDOWS APP</text>
    <text x="40" y="148" class="display" font-size="65" font-weight="400" letter-spacing="-3" fill="#F6F0E6">Taskflow</text>
    <text x="40" y="224" class="display" font-size="65" font-weight="400" letter-spacing="-3" fill="#F5D6C6">Local.</text>
    <text x="45" y="277" class="sans" font-size="23" fill="#F9E2D7">Your tasks. Your machine.</text>
    <text x="45" y="310" class="sans" font-size="23" fill="#F9E2D7">Your control.</text>
    <path d="M44 356H579" stroke="#B14D5A"/>
    <text x="45" y="391" class="mono" font-size="13" letter-spacing="1.1" fill="#F1D3C8">OFFLINE WORKSPACE · ON-DEVICE AI</text>
    <text x="45" y="424" class="mono" font-size="13" letter-spacing="1.1" fill="#F1D3C8">TAURI / RUST / REACT / SQLITE</text>
    <g class="float">
      <rect x="677" y="90" width="460" height="248" rx="18" fill="#F6F0E6"/>
      <path d="M677 134H1137" stroke="#DDCDC0"/>
      <circle cx="699" cy="112" r="4" fill="#B6565E"/>
      <circle cx="713" cy="112" r="4" fill="#D6B8AA"/>
      <circle cx="727" cy="112" r="4" fill="#DDCDC0"/>
      <text x="1109" y="118" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#78635D">LOCAL WORKSPACE</text>
      <text x="702" y="174" class="sans" font-size="23" font-weight="600" fill="#982D3C">A little more focus.</text>
      <rect x="702" y="195" width="410" height="43" rx="10" fill="#EADBCF"/>
      <rect x="716" y="208" width="16" height="16" rx="5" fill="#AB3D43"/>
      <path d="M720 216L723 219L729 212" fill="none" stroke="#F6F0E6" stroke-width="1.7" stroke-linecap="round"/>
      <text x="747" y="222" class="sans" font-size="15" fill="#51312F">Make space for what matters</text>
      <rect x="716" y="253" width="16" height="16" rx="5" fill="none" stroke="#BE837D"/>
      <text x="747" y="267" class="sans" font-size="15" fill="#51312F">Turn an idea into a next step</text>
      <rect x="716" y="295" width="16" height="16" rx="5" fill="none" stroke="#BE837D"/>
      <text x="747" y="309" class="sans" font-size="15" fill="#51312F">Keep the important things close</text>
    </g>
    <path d="M696 421H1125" stroke="#C77579" stroke-width="2"/>
    <path d="M696 421H1125" class="flow" stroke="#F5D6C6" stroke-width="2" stroke-dasharray="10 38"/>
    <g fill="#982D3C" stroke="#F3D7CD" stroke-width="1.5">
      <circle cx="701" cy="421" r="6"/><circle cx="839" cy="421" r="6"/><circle cx="977" cy="421" r="6"/><circle cx="1116" cy="421" r="6"/>
    </g>
    <g class="mono" font-size="11" fill="#F5D6C6" letter-spacing="1" text-anchor="middle">
      <text x="701" y="403">INPUT</text><text x="839" y="403">MODEL</text><text x="977" y="403">REVIEW</text><text x="1116" y="403">SAVE</text>
    </g>
  </g>
</svg>
