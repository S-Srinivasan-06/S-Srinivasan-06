late(-27 0) scale(1)"><g class="blink"><circle cx="0" cy="0" r="9" class="ink"/></g></g><g transform="translate(27 0) scale(1)"><g class="blink"><circle cx="0" cy="0" r="9" class="ink"/></g></g></g><path d="M-32 20Q0 56 32 20" class="ink-line" stroke-width="5" stroke-linecap="round"/></g></g><g transform="translate(748 356) scale(1)"><g class="counter"><path d="M-25 0H25M0-25V25" class="ink-line" stroke-width="4" /></g></g><path d="M1048 94C1164 95 1137 180 1180 186" class="two-line" stroke-width="5" /></g></svg>