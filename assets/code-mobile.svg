<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650" role="img" aria-labelledby="title desc">
<title id="title">Code you can reason about</title><desc id="desc">A reformatted excerpt of Taskflow Local&#x27;s task-creation Zod schema: action, title, local schedule, and duration are explicitly constrained.</desc>
<style>.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}
@media (prefers-reduced-motion: reduce) { .spin, .flow, .float, .pulse { animation: none !important; } }</style>
<defs><clipPath id="frame"><rect x="0" y="0" width="600" height="650" rx="18" fill="white"/></clipPath></defs>
<g clip-path="url(#frame)"><rect x="0" y="0" width="600" height="650" rx="0" fill="#2B2220"/><text x="32" y="48" class="mono" font-size="13" fill="#D86650" letter-spacing="1.4">ENGINEERING IN PRACTICE</text><text x="32" y="108" class="serif" font-size="44" fill="#F6F0E6" >Code you can</text><text x="32" y="160" class="serif" font-size="44" fill="#F6F0E6" font-style="italic">reason about.</text><path d="M32 193L568 193" stroke="#584541" stroke-width="1" /><text x="32" y="233" class="mono" font-size="12" fill="#D86650" >TASKFLOW LOCAL / ACTION SCHEMA</text><text x="32" y="286" class="mono" font-size="23" fill="#F6F0E6" xml:space="preserve">z.strictObject({</text><text x="32" y="323" class="mono" font-size="23" fill="#ECA797" xml:space="preserve">  action: z.literal(&#x27;create&#x27;),</text><text x="32" y="360" class="mono" font-size="23" fill="#F6F0E6" xml:space="preserve">  title,</text><text x="32" y="397" class="mono" font-size="23" fill="#F6F0E6" xml:space="preserve">  scheduled_at_local:</text><text x="32" y="434" class="mono" font-size="23" fill="#ECA797" xml:space="preserve">    localDate.optional(),</text><text x="32" y="471" class="mono" font-size="23" fill="#F6F0E6" xml:space="preserve">  duration_minutes: duration</text><text x="32" y="508" class="mono" font-size="23" fill="#F6F0E6" xml:space="preserve">})</text><text x="32" y="593" class="sans" font-size="19" fill="#F6F0E6" >Explicit inputs. Reviewable changes.</text></g></svg>