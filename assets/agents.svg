<g clip-path="url(#frame)"><rect x="0" y="0" width="1200" height="560" rx="0" fill="#F6F0E6"/><text x="44" y="70" class="serif" font-size="43" fill="#982D3C" >LLMs, with a system around them.</text><path d="M44 116L572 116" stroke="#DDCDC0" stroke-width="1" /><g transform="translate(44 149) scale(1)" fill="none" stroke="#982D3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="1" width="43" height="37" rx="4"/><path d="M0 11h43M9 20l6 5-6 5M22 31h11"/></g><text x="108" y="153" class="mono" font-size="12" fill="#982D3C" letter-spacing=".7">01 / AI DEVELOPMENT</text><text x="108" y="198" class="serif" font-size="29" fill="#2B2220" >Codex + Claude Code</text><text x="108" y="239" class="sans" font-size="20" fill="#78635D" >Repo exploration to implementation.</text><text x="108" y="270" class="sans" font-size="20" fill="#78635D" >Debugging and verification loops.</text><path d="M618 116L1146 116" stroke="#DDCDC0" stroke-width="1" /><g transform="translate(618 149) scale(1)" fill="none" stroke="#982D3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="11" width="24" height="24" rx="4"/><path d="M0 23h11M35 23h11M23 0v11M23 35v11M18 19l-4 4 4 4M28 19l4 4-4 4"/></g><text x="682" y="153" class="mono" font-size="12" fill="#982D3C" letter-spacing=".7">02 / CUSTOM HARNESSES</text><text x="682" y="198" class="serif" font-size="29" fill="#2B2220" >Models + tools + context</text><text x="682" y="239" class="sans" font-size="20" fill="#78635D" >Structured outputs and validation.</text><text x="682" y="270" class="sans" font-size="20" fill="#78635D" >Retry logic and review gates.</text><path d="M44 336L572 336" stroke="#DDCDC0" stroke-width="1" /><g transform="translate(44 369) scale(1)" fill="none" stroke="#982D3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="30" height="30" rx="3"/><rect x="16" y="16" width="14" height="14" rx="2"/><path d="M16 0v8M30 0v8M16 38v8M30 38v8M0 16h8M0 30h8M38 16h8M38 30h8"/></g><text x="108" y="373" class="mono" font-size="12" fill="#982D3C" letter-spacing=".7">03 / ON-DEVICE INFERENCE</text><text x="108" y="418" class="serif" font-size="29" fill="#2B2220" >Local LLMs</text><text x="108" y="459" class="sans" font-size="20" fill="#78635D" >llama.cpp · Gemma · Ollama</text><text x="108" y="490" class="sans" font-size="20" fill="#78635D" >Model lifecycle and provider routing.</text><path d="M618 336L1146 336" stroke="#DDCDC0" stroke-width="1" /><g transform="translate(618 369) scale(1)" fill="none" stroke="#982D3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="6" r="5"/><circle cx="4" cy="37" r="5"/><circle cx="38" cy="37" r="5"/><path d="M21 11v10M4 32V21h34v11"/></g><text x="682" y="373" class="mono" font-size="12" fill="#982D3C" letter-spacing=".7">04 / AGENT ORCHESTRATION</text><text x="682" y="418" class="serif" font-size="29" fill="#2B2220" >Stateful workflows</text><text x="682" y="459" class="sans" font-size="20" fill="#78635D" >LangGraph · MCP · Docker</text><text x="682" y="490" class="sans" font-size="20" fill="#78635D" >Execution, feedback, and cleanup.</text></g></svg>