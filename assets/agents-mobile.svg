<svg xmlns="http://www.w3.org/2000/svg" width="600" height="990" viewBox="0 0 600 990" role="img" aria-labelledby="title desc">
<title id="title">LLMs, with a system around them</title><desc id="desc">Codex and Claude Code workflows, custom harnesses, local LLM execution, and stateful agent orchestration.</desc>
<style>.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}
