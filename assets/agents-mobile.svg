<defs><clipPath id="frame"><rect x="0" y="0" width="600" height="990" rx="18" fill="white"/></clipPath></defs>
<g clip-path="url(#frame)"><rect x="0" y="0" width="600" height="990" rx="0" fill="#F6F0E6"/><text x="32" y="61" class="serif" font-size="37" fill="#982D3C" >LLMs, with a system</text><text x="32" y="108" class="serif" font-size="37" fill="#982D3C" font-style="italic">around them.</text><path d="M32 148L568 148" stroke="#DDCDC0" stroke-width="1" /><g transform="translate(32 181) scale(1)" fill="none" stroke="#982D3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="1" width="43" height="37" rx="4"/><path d="M0 11h43M9 20l6 5-6 5M22 31h11"/></g><text x="96" y="185" class="mono" font-size="12" fill="#982D3C" letter-spacing=".7">01 / AI DEVELOPMENT</text><text x="96" y="230" class="serif" font-size="29" fill="#2B2220" >Codex + Claude Code</text><text x="96" y="271" class="sans" font-size="20" fill="#78635D" >Repo exploration to implementation.</text><text x="96" y="302" class="sans" font-size="20" fill="#78635D" >Debugging and verification loops.</text><path d="M32 356L568 356" stroke="#DDCDC0" stroke-width="1" /><g transform="translate(32 389) scale(1)" fill="none" stroke="#982D3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="11" width="24" height="24" rx="4"/><path d="M0 23h11M35 23h11M23 0v11M23 35v11M18 19l-4 4 4 4M28 19l4 4-4 4"/></g><text x="96" y="393" class="mono" font-size="12" fill="#982D3C" letter-spacing=".7">02 / CUSTOM HARNESSES</text><text x="96" y="438" class="serif" font-size="29" fill="#2B2220" >Models + tools + context</text><text x="96" y="479" class="sans" font-size="20" fill="#78635D" >Structured outputs and validation.</text><text x="96" y="510" class="sans" font-size="20" fill="#78635D" >Retry logic and review gates.</text><path d="M32 564L568 564" stroke="#DDCDC0" stroke-width="1" /><g transform="translate(32 597) scale(1)" fill="none" stroke="#982D3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="30" height="30" rx="3"/><rect x="16" y="16" width="14" height="14" rx="2"/><path d="M16 0v8M30 0v8M16 38v8M30 38v8M0 16h8M0 30h8M38 16h8M38 30h8"/></g><text x="96" y="601" class="mono" font-size="12" fill="#982D3C" letter-spacing=".7">03 / ON-DEVICE INFERENCE</text><text x="96" y="646" class="serif" font-size="29" fill="#2B2220" >Local LLMs</text><text x="96" y="687" class="sans" font-size="20" fill="#78635D" >llama.cpp · Gemma · Ollama</text><text x="96" y="718" class="sans" font-size="20" fill="#78635D" >Model lifecycle and provider routing.</text><path d="M32 772L568 772" stroke="#DDCDC0" stroke-width="1" /><g transform="translate(32 805) scale(1)" fill="none" stroke="#982D3C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="6" r="5"/><circle cx="4" cy="37" r="5"/><circle cx="38" cy="37" r="5"/><path d="M21 11v10M4 32V21h34v11"/></g><text x="96" y="809" class="mono" font-size="12" fill="#982D3C" letter-spacing=".7">04 / AGENT ORCHESTRATION</text><text x="96" y="854" class="serif" font-size="29" fill="#2B2220" >Stateful workflows</text><text x="96" y="895" class="sans" font-size="20" fill="#78635D" >LangGraph · MCP · Docker</text><text x="96" y="926" class="sans" font-size="20" fill="#78635D" >Execution, feedback, and cleanup.</text></g></svg>