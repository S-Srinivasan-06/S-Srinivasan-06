<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Code you can reason about</title><desc id="desc">A reformatted excerpt of Taskflow Local&#x27;s task-creation Zod schema: action, title, local schedule, and duration are explicitly constrained.</desc>
<style>.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}
@media (prefers-reduced-motion: reduce) { .spin, .flow, .float, .pulse { animation: none !important; } }</style>
<defs><clipPath id="frame"><rect x="0" y="0" width="1200" height="360" rx="18" fill="white"/></clipPath></defs>
<g clip-path="url(#frame)"><rect x="0" y="0" width="1200" height="360" rx="0" fill="#2B2220"/><text x="44" y="50" class="mono" font-size="13" fill="#D86650" letter-spacing="1.4">ENGINEERING IN PRACTICE</text><text x="44" y="131" class="serif" font-size="48" fill="#F6F0E6" >Code you can</text><text x="44" y="190" class="serif" font-size="48" fill="#F6F0E6" font-style="italic">reason about.</text><text x="44" y="249" class="sans" font-size="19" fill="#D9C5BA" >Explicit inputs.</text><text x="44" y="278" class="sans" font-size="19" fill="#D9C5BA" >Reviewable changes.</text><path d="M505 35L505 325" stroke="#584541" stroke-width="1" /><text x="554" y="51" class="mono" font-size="12" fill="#D86650" letter-spacing="1">TASKFLOW LOCAL / ACTION SCHEMA</text><text x="554" y="101" class="mono" font-size="21" fill="#F6F0E6" xml:space="preserve">z.strictObject({</text><text x="554" y="132" class="mono" font-size="21" fill="#ECA797" xml:space="preserve">  action: z.literal(&#x27;create&#x27;),</text><text x="554" y="163" class="mono" font-size="21" fill="#F6F0E6" xml:space="preserve">  title,</text><text x="554" y="194" class="mono" font-size="21" fill="#F6F0E6" xml:space="preserve">  scheduled_at_local:</text><text x="554" y="225" class="mono" font-size="21" fill="#ECA797" xml:space="preserve">    localDate.optional(),</text><text x="554" y="256" class="mono" font-size="21" fill="#F6F0E6" xml:space="preserve">  duration_minutes: duration</text><text x="554" y="287" class="mono" font-size="21" fill="#F6F0E6" xml:space="preserve">})</text></g></svg>