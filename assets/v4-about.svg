<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title"><title id="title">About me — working across the whole system</title><style>
.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}
.paper{fill:#F4EDDC}.ink{fill:#221D24}.line{fill:none;stroke:#221D24}.one{fill:#D94136;animation:p1 18s step-end infinite}.two{fill:#294DFF;animation:p2 18s step-end infinite}
.one-line{fill:none;stroke:#D94136;animation:s1 18s step-end infinite}.two-line{fill:none;stroke:#294DFF;animation:s2 18s step-end infinite}
.phase-b .one{fill:#5D287E;animation-delay:-9s}.phase-b .two{fill:#C9E54E;animation-delay:-9s}.phase-b .one-line{stroke:#5D287E;animation-delay:-9s}.phase-b .two-line{stroke:#C9E54E;animation-delay:-9s}
@keyframes p1{0%,100%{fill:#D94136}50%{fill:#5D287E}}@keyframes p2{0%,100%{fill:#294DFF}50%{fill:#C9E54E}}@keyframes s1{0%,100%{stroke:#D94136}50%{stroke:#5D287E}}@keyframes s2{0%,100%{stroke:#294DFF}50%{stroke:#C9E54E}}
.grid-move{animation:grid-move 8s ease-in-out infinite}.grid-return{animation:grid-move 8s ease-in-out -4s infinite}.drift{animation:drift 6s ease-in-out infinite}.loop{animation:turn 24s linear infinite;transform-origin:0px 0px}.reverse{animation:turn 32s linear infinite reverse;transform-origin:0px 0px}.scan{animation:scan 8s ease-in-out infinite}.dash{animation:dash 6s linear infinite}
@keyframes grid-move{0%,100%{transform:translate(0,0)}25%{transform:translate(96px,0)}50%{transform:translate(96px,96px)}75%{transform:translate(0,96px)}}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(144px)}}@keyframes dash{to{stroke-dashoffset:-80}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><clipPath id="frame"><rect x="0" y="0" width="1200" height="320" rx="8" class="paper"/></clipPath></defs><g class="phase-b" clip-path="url(#frame)"><rect x="0" y="0" width="1200" height="320" rx="0" class="paper"/><text x="40" y="48" font-size="15" class="ink mono" >01 / ABOUT ME</text><text x="38" y="122" font-size="43" class="ink serif" >I like working across</text><text x="38" y="173" font-size="43" class="ink serif" >the whole system.</text><text x="40" y="234" font-size="24" class="ink sans" >Interface details, API contracts, data storage,</text><text x="40" y="268" font-size="24" class="ink sans" >and the parts that must work beyond a demo.</text><text x="40" y="302" font-size="21" class="ink sans" >Desktop apps, finance, vision, and agent tooling.</text><g transform="translate(831 40) scale(1)"><path d="M0 0V240" class="line" stroke-width="1" /><path d="M48 0V240" class="line" stroke-width="1" /><path d="M96 0V240" class="line" stroke-width="1" /><path d="M144 0V240" class="line" stroke-width="1" /><path d="M192 0V240" class="line" stroke-width="1" /><path d="M240 0V240" class="line" stroke-width="1" /><path d="M288 0V240" class="line" stroke-width="1" /><path d="M0 0H288" class="line" stroke-width="1" /><path d="M0 48H288" class="line" stroke-width="1" /><path d="M0 96H288" class="line" stroke-width="1" /><path d="M0 144H288" class="line" stroke-width="1" /><path d="M0 192H288" class="line" stroke-width="1" /><path d="M0 240H288" class="line" stroke-width="1" /><g transform="translate(48 48) scale(1)"><g class="grid-move"><rect x="0" y="0" width="48" height="48" rx="0" class="one"/></g></g><g transform="translate(144 48) scale(1)"><g class="grid-return"><rect x="0" y="0" width="48" height="48" rx="0" class="two"/></g></g></g><text x="832" y="303" font-size="15" class="ink mono" >BUILD / CONNECT / REFINE</text></g></svg>