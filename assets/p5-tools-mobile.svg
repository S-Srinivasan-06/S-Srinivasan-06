<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820" viewBox="0 0 600 820" role="img" aria-labelledby="title desc"><title id="title">Tools used in my projects and development workflow</title><desc id="desc">FastAPI, Docker, PostgreSQL, React, OpenCV, LangGraph, MCP, Ollama, Codex and Claude Code. Icons are original line illustrations; names identify the tools.</desc><style>
