 stroke="#315A88" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6" class="flow"/><rect x="22" y="125" width="358" height="58" rx="8" fill="#F5F0E7"/><text x="40" y="148" font-size="13" fill="#315A88" class="mono" letter-spacing=".4">OWNERSHIP + VERSION CHECK</text><text x="40" y="171" font-size="15" fill="#252C36" class="sans" >Integration tests at the boundaries.</text><text x="22" y="214" font-size="12" fill="#315A88" class="mono" letter-spacing=".4">SPRING BOOT / POSTGRESQL</text></g><path d="M30 707H570" stroke="#D7E2ED" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="30" y="747" font-size="17" fill="#F5F0E7" class="mono" letter-spacing=".4">VIEW REPOSITORY ↗</text><path d="M534 745L555 724M534 724H555V745" stroke="#F5F0E7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /></g></svg>