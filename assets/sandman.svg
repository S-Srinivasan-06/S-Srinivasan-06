  <path d="M776 126H819M963 126H1013M891 152V195H704V152" fill="none" stroke="#91af85" stroke-width="1.5"/>
  <path d="M810 121L819 126L810 131M1004 121L1013 126L1004 131M699 161L704 152L709 161" fill="none" stroke="#91af85" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="632" y="100" width="144" height="52" rx="12" fill="#f3f0e7"/>
  <rect x="819" y="100" width="144" height="52" rx="12" fill="#d5edb5"/>
