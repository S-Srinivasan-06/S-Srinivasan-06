  <text x="40" y="133" class="sans" font-size="60" font-weight="650" letter-spacing="-2.5" fill="#f3f0e7">Sandman</text>
  <text x="44" y="180" class="sans" font-size="20" fill="#cbd9c8">Agents with a workspace.</text>
  <text x="44" y="259" class="mono" font-size="12" letter-spacing="1.2" fill="#b8cfbc">LANGGRAPH / MCP TOOLS / DOCKER</text>
  <rect x="605" y="42" width="548" height="207" rx="16" fill="none" stroke="#4b6550" stroke-dasharray="5 7"/>
