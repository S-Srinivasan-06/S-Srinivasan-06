<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="365" viewBox="0 0 1200 365" role="img" aria-labelledby="title desc"><title id="title">LLM development and custom harnesses</title><desc id="desc">Codex and Claude Code for repository exploration, implementation, debugging and review. Custom harnesses, local inference, structured outputs, scoped tool execution and agent orchestration are represented in Taskflow Local and Sandman.</desc><style>
.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:Consolas,'Courier New',monospace}
.flow{animation:flow 7s linear infinite}.packet{animation:packet 8s ease-in-out infinite}.scan{animation:scan 9s ease-in-out infinite}.grid-step{animation:grid-step 12s ease-in-out infinite}.orbit{animation:orbit 40s linear infinite;transform-origin:0px 0px}
@keyframes flow{to{stroke-dashoffset:-112}}@keyframes packet{0%,100%{transform:translateX(0)}50%{transform:translateX(120px)}}@keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(144px)}}@keyframes grid-step{0%,100%{transform:translate(0,0)}25%{transform:translate(48px,0)}50%{transform:translate(48px,48px)}75%{transform:translate(0,48px)}}@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><clipPath id="frame"><rect x="0" y="0" width="1200" height="365" rx="14" fill="#F5F0E7"/></clipPath></defs><g clip-path="url(#frame)"><rect x="0" y="0" width="1200" height="365" rx="0" fill="#F5F0E7"/><text x="42" y="49" font-size="15" fill="#96394A" class="mono" letter-spacing=".4">LLM DEVELOPMENT</text><text x="38" y="112" font-size="43" fill="#252C36" class="serif" >Coding agents, custom harnesses, and local models.</text><text x="42" y="169" font-size="25" fill="#252C36" class="sans" >I use Codex and Claude Code for repository exploration, implementation, debugging, and review.</text><text x="42" y="207" font-size="25" fill="#252C36" class="sans" >Taskflow Local and Sandman connect models to structured outputs, validation, and tool access.</text><text x="42" y="245" font-size="25" fill="#252C36" class="sans" >Their execution loops cover local inference, agent orchestration, retries, and cleanup.</text><path d="M42 290H1158" stroke="#EAD5D4" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="42" y="330" font-size="17" fill="#96394A" class="mono" letter-spacing=".4">CONTEXT → MODEL → TOOLS → VALIDATION → REVIEW</text><path d="M834 326H1154" stroke="#96394A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 20" class="flow"/></g></svg>